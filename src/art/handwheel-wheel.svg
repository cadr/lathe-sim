<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <title>Handwheel</title>
  <defs>
    <linearGradient id="hw-rim" x1="0.15" y1="0.1" x2="0.85" y2="0.9">
      <stop offset="0" stop-color="#d6d9dd"/>
      <stop offset="0.5" stop-color="#8d939a"/>
      <stop offset="1" stop-color="#5a6067"/>
    </linearGradient>
    <linearGradient id="hw-spoke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f757c"/>
      <stop offset="0.45" stop-color="#c3c7cc"/>
      <stop offset="1" stop-color="#70767d"/>
    </linearGradient>
    <radialGradient id="hw-hub" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#e4e6e9"/>
      <stop offset="0.6" stop-color="#9ba1a8"/>
      <stop offset="1" stop-color="#5d636a"/>
    </radialGradient>
    <radialGradient id="hw-knob" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#6b7178"/>
      <stop offset="1" stop-color="#23272b"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="94" fill="#3f4448" opacity="0.35"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="url(#hw-rim)" stroke-width="16"/>
  <circle cx="100" cy="100" r="94" fill="none" stroke="#4a4f55" stroke-width="1.5" opacity="0.8"/>
  <circle cx="100" cy="100" r="78" fill="none" stroke="#454a50" stroke-width="1.5" opacity="0.7"/>
  <g fill="url(#hw-spoke)" stroke="#4a4f55" stroke-width="1.5">
    <rect x="91" y="22" width="18" height="78" rx="5"/>
    <rect x="91" y="22" width="18" height="78" rx="5" transform="rotate(120 100 100)"/>
    <rect x="91" y="22" width="18" height="78" rx="5" transform="rotate(240 100 100)"/>
  </g>
  <circle cx="100" cy="100" r="24" fill="url(#hw-hub)" stroke="#4a4f55" stroke-width="2"/>
  <circle cx="100" cy="100" r="9" fill="#464b51" stroke="#2f3338" stroke-width="2"/>
  <circle cx="100" cy="100" r="3" fill="#aeb3b9"/>
  <g transform="translate(161 161)">
    <circle r="13" fill="url(#hw-knob)" stroke="#16181a" stroke-width="1.5"/>
